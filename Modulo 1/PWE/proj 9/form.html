<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'> <!--link para os icones (é uma biblioteca em outras palavras)-->
    <link rel="stylesheet" href="css/form.css">
    <title>Login</title>
</head>
<body>
    <div class="login">

        <div id="relogio"></div>
        <header>
            <h1>LOGIN</h1>
        </header>

        <aside class="aside_left"></aside>

        <main class="container">
            <form>
                <h1>Login</h1>
                <div class="input-box">
                    <input placeholder="Usuário" type="email">
                    <i class="bx bxs-user"></i>
                </div>

                <div class="input-box">
                    <input placeholder="Senha" type="password">
                    <i class="bx bxs-lock-alt"></i>
                </div>

                <div class="lembre-esqueci">
                    <label>
                    <input type="checkbox">
                    Lembre de mim
                    </label>
                    <a href="#">Esqueci a senha</a> <!--ao colocar # o link n vai te levar a lugar nenhum-->
                </div>

                <button type="submit" class="botao_login">Login</button> <!--Botão de login-->

                <div class="registrar">
                    <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
                </div>

            </form>
        </main>

        <aside class="aside_right"></aside>

        <footer>
            <p>REDES SOCIAIS: 
                <a href="https://www.instagram.com/gatofe_ofc">Instagram</a> | 
                <a href="#">TikTok</a> | 
                <a href="https://x.com/FeGato91985">X</a> | 
                <a href="index.html">Voltar</a>
            </p>
        </footer>
    </div>
</body>
</html>
