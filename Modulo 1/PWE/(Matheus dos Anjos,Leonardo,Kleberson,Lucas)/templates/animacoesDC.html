  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Inicializa os dois carrosseis sem intervalo próprio
      let leftCarousel = new bootstrap.Carousel(document.querySelector("#carouselLeftF"), {
        interval: false
      });
  
      let rightCarousel = new bootstrap.Carousel(document.querySelector("#carouselRightF"), {
        interval: false
      });
  
      // Sincroniza a troca
      setInterval(() => {
        leftCarousel.next();
        rightCarousel.next();
      }, 10000); // troca a cada 10 segundos
    });
  </script>
