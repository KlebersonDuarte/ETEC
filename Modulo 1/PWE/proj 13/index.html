<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
    produto = prompt("Digite o seu produto:");
    valor = parseFloat(prompt("Digite o valor:"));
    qt = parseInt(prompt("Digite a quantidade"));
    
    document.write("Produto comprado: " + produto +"<br>");
    document.write("valor: " +valor +" - Quantidade comprada: " + qt +"<br>" );

    valort = valor * qt
    document.write("Valor total R$" +valort);



</script>
</body>
</html>
